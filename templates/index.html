<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TutorTube Forge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Spectral:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="shell">
      <section class="hero panel">
        <p class="eyebrow">YOUTUBE → INTERACTIVE LEARNING</p>
        <h1>TutorTube Forge</h1>
        <p class="subtitle">
          Paste a YouTube link. Extract transcript insights. Learn through a guided interactive concept tutorial.
        </p>
        <form id="tutorial-form" novalidate>
          <label for="youtube-url">YouTube URL</label>
          <div class="input-row">
            <input
              id="youtube-url"
              name="youtube-url"
              type="url"
              autocomplete="off"
              placeholder="https://www.youtube.com/watch?v=..."
              required
            />
            <button id="generate-button" type="submit">Generate</button>
          </div>
          <p class="hint">Supports watch links, youtu.be links, and shorts URLs.</p>
        </form>
      </section>

      <section id="status-panel" class="status panel" hidden>
        <p id="status-text"></p>
      </section>

      <section id="tutorial-panel" class="tutorial panel" hidden>
        <div class="tutorial-header">
          <div>
            <p class="eyebrow">GENERATED TUTORIAL</p>
            <h2 id="tutorial-title"></h2>
            <p id="tutorial-objective" class="objective"></p>
            <p id="tutorial-meta" class="meta"></p>
          </div>
          <div class="video-wrap">
            <iframe
              id="video-player"
              title="YouTube player"
              src=""
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
            ></iframe>
          </div>
        </div>

        <div class="progress-wrap">
          <div class="progress-track">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <p id="progress-text"></p>
        </div>

        <div class="content-grid">
          <aside>
            <h3>Steps</h3>
            <nav id="step-nav" class="step-nav"></nav>
          </aside>

          <article class="step-card">
            <div class="step-head">
              <p id="step-index-label"></p>
              <p id="step-timestamp" class="timestamp"></p>
            </div>
            <h3 id="step-title"></h3>
            <p id="step-summary"></p>

            <section>
              <h4>Key Points</h4>
              <ul id="key-points-list" class="key-points"></ul>
            </section>

            <section>
              <h4>Keywords</h4>
              <div id="keyword-list" class="keyword-list"></div>
            </section>

            <section class="check-section">
              <h4>Check Yourself</h4>
              <p id="question-text"></p>
              <button id="reveal-answer-btn" type="button" class="subtle-btn">Reveal Answer</button>
              <p id="answer-text" class="answer" hidden></p>
            </section>

            <div class="step-actions">
              <button id="prev-step-btn" type="button" class="subtle-btn">← Previous</button>
              <button id="next-step-btn" type="button" class="subtle-btn">Next →</button>
            </div>
          </article>
        </div>

        <section>
          <h3>Glossary</h3>
          <div id="glossary-list" class="glossary"></div>
        </section>
      </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
